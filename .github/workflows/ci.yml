name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]' yantrikdb==0.23.1
      - name: Python syntax check
        run: python -m py_compile app.py backend.py sqlite_reader.py
      - name: JavaScript syntax check
        run: node --check static/app.js
      - name: Full test suite (Linux)
        if: runner.os == 'Linux'
        run: python -m pytest
      - name: Cross-platform SQLite isolation regressions
        if: runner.os != 'Linux'
        run: python -m pytest tests/test_sqlite_reader.py
